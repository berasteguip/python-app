<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conversor de Divisas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --color-bg-start: #0f172a;
            --color-bg-end: #312e81;
            --color-surface: rgba(255, 255, 255, 0.96);
            --color-text: #1e293b;
            --color-muted: #64748b;
            --color-border: #e2e8f0;
            --color-primary: #6366f1;
            --color-primary-hover: #4f46e5;
            --color-accent: #0d9488;
            --font-body: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            --font-heading: 'Poppins', var(--font-body);
        }
        body {
            min-height: 100vh;
            padding: 1rem;
            background: linear-gradient(135deg, var(--color-bg-start), var(--color-bg-end));
            color: var(--color-text);
            font-family: var(--font-body);
        }
        h1, h2, h3 {
            font-family: var(--font-heading);
            font-weight: 700;
            letter-spacing: -0.02em;
        }
        .converter-card {
            width: 100%;
            max-width: 440px;
            border: none;
            border-radius: 20px;
            backdrop-filter: blur(10px);
            background: var(--color-surface);
        }
        .form-label {
            font-weight: 500;
            color: var(--color-muted);
        }
        .form-control,
        .form-select {
            border-color: var(--color-border);
            border-radius: 12px;
        }
        .form-control:focus,
        .form-select:focus {
            border-color: var(--color-primary);
            box-shadow: 0 0 0 0.25rem rgba(99, 102, 241, 0.25);
        }
        .btn-primary {
            --bs-btn-bg: var(--color-primary);
            --bs-btn-border-color: var(--color-primary);
            --bs-btn-hover-bg: var(--color-primary-hover);
            --bs-btn-hover-border-color: var(--color-primary-hover);
            --bs-btn-active-bg: var(--color-primary-hover);
            --bs-btn-active-border-color: var(--color-primary-hover);
            font-weight: 600;
            border-radius: 12px;
        }
        .swap-arrow {
            color: var(--color-muted);
            font-size: 1.25rem;
        }
        .result-box {
            font-family: var(--font-heading);
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--color-accent);
        }
        @media (max-width: 575.98px) {
            .converter-card {
                padding: 1.5rem !important;
            }
            .converter-card h2 {
                font-size: 1.5rem;
            }
            .swap-arrow {
                transform: rotate(90deg);
            }
        }

        /* ===== Navbar ===== */
        .app-navbar {
            font-family: 'Poppins', system-ui, sans-serif;
            background: rgba(10, 25, 60, 0.55);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.12);
        }
        .app-navbar .navbar-brand {
            font-weight: 600;
            letter-spacing: 0.3px;
        }
        .app-navbar .brand-accent {
            color: #5eead4;
        }
        .app-navbar .nav-link {
            position: relative;
            font-weight: 500;
        }
        @media (min-width: 768px) {
            /* Subrayado animado (::before para no pisar la flecha del dropdown) */
            .app-navbar .nav-link::before {
                content: "";
                position: absolute;
                left: 0.5rem;
                right: 0.5rem;
                bottom: 0.2rem;
                height: 2px;
                border-radius: 2px;
                background: #5eead4;
                transform: scaleX(0);
                transition: transform 0.2s ease;
            }
            .app-navbar .nav-link:hover::before,
            .app-navbar .nav-link.active::before {
                transform: scaleX(1);
            }
        }
    </style>
</head>

<body class="d-flex justify-content-center align-items-center">

    <div class="card shadow-lg p-4 converter-card">
<body class="d-flex flex-column min-vh-100">

    <nav class="navbar navbar-expand-md sticky-top app-navbar" data-bs-theme="dark">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center gap-2" href="/">
                <img src="{{ url_for('static', filename='img/logo.svg') }}" alt="" width="32" height="32">
                <span>Divisa<span class="brand-accent">Ya</span></span>
            </a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav"
                    aria-controls="mainNav" aria-expanded="false" aria-label="Abrir menú">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="mainNav">
                <ul class="navbar-nav mx-auto gap-md-3">
                    <li class="nav-item">
                        <a class="nav-link active" aria-current="page" href="/">Conversor</a>
                    </li>
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                            Tipos de cambio
                        </a>
                        <ul class="dropdown-menu">
                            <li><h6 class="dropdown-header">Tasas fijas de referencia</h6></li>
                            <li><span class="dropdown-item-text">1 EUR = 1,10 USD</span></li>
                            <li><span class="dropdown-item-text">1 EUR = 0,86 GBP</span></li>
                            <li><span class="dropdown-item-text">1 USD = 0,78 GBP</span></li>
                        </ul>
                    </li>
                </ul>
                <a class="btn btn-outline-light btn-sm rounded-pill px-3 my-2 my-md-0"
                   href="https://github.com/berasteguip/python-app" target="_blank" rel="noopener">
                    Ver en GitHub
                </a>
            </div>
        </div>
    </nav>

    <main class="flex-grow-1 d-flex justify-content-center align-items-center p-3">
    <div class="card shadow-lg p-4 converter-card" style="width: 400px;">
        <h2 class="text-center mb-4">💱 Conversor de Divisas</h2>

        <form method="post">
            <div class="mb-3">
                <label class="form-label">Cantidad</label>
                <input type="number" step="0.01" name="amount" 
                       class="form-control form-control-lg" 
                       placeholder="Introduce cantidad" required>
            </div>

            <div class="row g-2 mb-3">
                <div class="col-12 col-sm">
                    <select name="from_currency" class="form-select">
                        <option value="EUR">EUR €</option>
                        <option value="USD">USD $</option>
                        <option value="GBP">GBP £</option>
                    </select>
                </div>
                <div class="col-12 col-sm-auto text-center align-self-center swap-arrow">
                    →
                </div>
                <div class="col-12 col-sm">
                    <select name="to_currency" class="form-select">
                        <option value="USD">USD $</option>
                        <option value="EUR">EUR €</option>
                        <option value="GBP">GBP £</option>
                    </select>
                </div>
            </div>

            <div class="d-grid">
                <button type="submit" class="btn btn-primary btn-lg">
                    Convertir
                </button>
            </div>
        </form>

        {% if result is not none %}
            <div class="mt-4 text-center result-box">
                {{ result }}
            </div>
        {% endif %}
    </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
